<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beng Café</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Helvetica, Arial, sans-serif;
    overflow: hidden;
}

/* 🌄 BACKGROUND */
.bg {
    position: fixed;
    inset: 0;
    background: url("image-cafe.jpeg") center/cover no-repeat;
    transform: scale(1.05);
}

.bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
}

/* ☰ NAVIGATION */
.nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 42px;

    z-index: 10;

    background: rgba(0,0,0,0.12);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);

    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.nav a {
    color: rgba(255,255,255,0.92);
    text-decoration: none;

    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1.2px;

    transition: opacity 0.2s ease, transform 0.2s ease;
}

.nav a:hover {
    opacity: 0.65;
    transform: translateY(-1px);
}

/* ☕ CENTER — LOGO */
.center {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    transform: translateY(-85px);

    z-index: 2;
}

.logo {
    width: min(1500px, 92vw);
    height: auto;

    animation: fadeIn 1.2s ease forwards;

    filter:
        drop-shadow(0 0 10px rgba(255,255,255,0.22))
        drop-shadow(0 0 30px rgba(255,220,180,0.12));
}

/* 📍 FOOTER */
.footer {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 12px;
    line-height: 1.5;

    color: rgba(255,255,255,0.6);

    z-index: 5;
}

/* ✨ ANIMATION */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* 📱 MOBILE */
@media (max-width: 768px) {

    .nav {
        height: 60px;
        gap: 22px;

        justify-content: flex-start;

        padding: 0 20px;

        overflow-x: auto;
        white-space: nowrap;

        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }

    .nav::-webkit-scrollbar {
        display: none;
    }

    .nav a {
        flex-shrink: 0;
        font-size: 12px;
        letter-spacing: 0.9px;
    }

    .logo {
        width: 200vw !important;
        max-width: none !important;
    }

    .center {
        transform: translateY(-85px);
    }
}

/* 📱 LANDSCAPE */
@media (max-width: 932px) and (orientation: landscape) {

    .nav {
        height: 55px;
        gap: 25px;
    }

    .center {
        transform: translateY(-60px);
    }
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- NAVIGATION -->
<nav class="nav">

    <a href="#accueil">ACCUEIL</a>

    <a href="#lieu">LE LIEU</a>

    <a href="#boissons">BOISSONS</a>

    <a href="#restauration">RESTAURATION</a>

    <a href="#infos">INFOS</a>

</nav>

<!-- ACCUEIL -->
<section id="accueil">

    <div class="center">
        <img src="logo.svg" class="logo" alt="Beng Café">
    </div>

    <div class="footer">
        24 rue du Frout · Quimper<br>
        Jeu 11h–18h · Ven–Lun 9h45–18h
    </div>

</section>

</body>
</html>
